# The platform's builder (spec/plugins-are-shared-through-registries
# requirements 13, 14, 19 and 20; item 102; plan Q1, Q4, Q5; rulings 135 and
# 136).
#
# A TEMPLATE, kept in meridian-platform, for the public repository
# `open-meridian/plugin-builder` (approved 2026-10-16, ruling 143; created by
# the product owner at deploy time). It is copied there as
# .github/workflows/build.yaml. Nothing here runs in this repository: this
# path is outside .github/workflows on purpose.
#
# Two jobs, so the publisher's code never reaches the signing key (SLSA
# Build L3; ruling 136):
#
# - `build` checks out the commit the tag pins, verifies the tag's SSH
#   signature against the organisation's keys active now (SigningKeyStatus),
#   builds on plugin-python (held to it by the image's own layers), reads
#   the image's metadata from the image itself, scans with Trivy (bill of
#   materials, vulnerabilities, secrets) and ClamAV (malware), runs the
#   role's conformance suite in the image and measures the image. The publisher's Dockerfile runs
#   here, so this job holds no id-token and cannot push: its permissions are
#   contents: read alone. It hands the image and its findings on as
#   artifacts.
# - `sign` never checks out or runs the publisher's code. It tells the
#   platform the build has begun (RecordBuildStarted, with the public log),
#   loads the image tarball, enforces the 1 GiB cap, pushes by digest,
#   attaches the provenance, the image's metadata, the bill of materials and
#   the scans as OCI referrers signed with the platform's KMS key (cosign,
#   Workload Identity Federation), holds the build job's output to plan Q4's
#   policy as one BuildFinding per check, and hands the platform the digest
#   and those findings (RecordBuildResults). It is the only job with
#   id-token: write, and runs in the GitHub environment `signing`, so its
#   OIDC subject is GitHub's immutable form, with the owner's and the
#   repository's IDs:
#   `repo:open-meridian@290371739/plugin-builder@1423678364:environment:signing`.
#
# Each attestation is a Sigstore bundle (`cosign attest --new-bundle-format`,
# the format cosign 3 makes the default), pushed as an OCI 1.1 referrer of
# the image: through the registry's referrers API, or, where a registry has
# none (ghcr.io answers it 404), in the referrers tag schema `sha256-<hex>`,
# which cosign keeps. No transparency log: the platform verifies each
# bundle's DSSE envelope against its own key. Proven with cosign v2.5.2, a
# throwaway key and local registries of both kinds (meridian-platform v25.3,
# tests/fixtures/referrers/cosign-2.5.2.json); cosign 2's `attest` has no
# --registry-referrers-mode (that flag is `sign`'s).
#
# DESIGN25's RecordBuildResultsRequest carries the image's digest and the
# findings alone. The platform reads the rest from the image's referrers by
# digest: the provenance (`https://slsa.dev/provenance/v1`, naming the
# repository, commit, tag, signer and builder) and the image's metadata
# (`<NAME?:https://open-meridian.dev/attestation/plugin-metadata/v1>`: its
# PluginMetadata, the contract version it declares, and the documentation's
# texts). The scan policy is the builder's: a secret, malware, a CISA KEV
# entry or a fixable critical blocks; any other vulnerability warns; strong
# copyleft in the bill of materials warns, for counsel. The base images and
# community's licence come from the platform, as inputs.
#
# The KMS key's Workload Identity Federation is pinned to that job: its
# attribute condition requires
#   assertion.sub ==
#     'repo:open-meridian@290371739/plugin-builder@1423678364:environment:signing'
#   && assertion.job_workflow_ref ==
#      'open-meridian/plugin-builder/.github/workflows/build.yaml@refs/heads/main'
# and grants roles/cloudkms.signerVerifier on the one key and nothing else.
# The platform's intake takes results only with that job's token: GitHub's
# issuer, the platform's audience, this repository, this workflow at
# refs/heads/main, and the build's one-time nonce (ruling 135).
#
# Started only by the platform (workflow_dispatch through the GitHub App, on
# a publish request). The platform decides; the builder reports. Community
# build logs are public.
#
# Before the repository is created: pin every action and image below to a
# commit SHA or digest (the project's SHA-pin rule; tags are written here only
# as placeholders), create the `signing` environment limited to the main
# branch, and set the repository variables.
#
# Nothing the dispatch or the build job hands on is written into a script:
# every `inputs.*`, `needs.*.outputs.*` and `steps.*.outputs.*` a `run:`
# block uses reaches it through `env:` and is quoted there, so text the
# publisher controls (a Dockerfile's FROM line, say) is data to the shell,
# never code (GitHub's script-injection guidance). The build's one-time
# nonce is masked by the signing job's first step, read from the event
# payload, before any step header could print it.
#
# DESIGN25's seams, closed by rulings 268 to 271 (2026-10-18): the image's
# metadata is read from the built image with the SDK's own
# `meridian-declaration` (CLI 0.1.46 and SDK 0.29.0 need nothing new);
# conformance is each role's suite through the SDK's runner and the
# plugin's tests, `meridian plugin check --verified --run-tests` inside a
# layer over the image; "built on plugin-python" is the image's layers
# beginning with an allowed base's.
#
# `smoke_test` (ruling 271) runs neither job: a `smoke` job in the same
# `signing` environment, so its token meets the key's condition unchanged,
# attests a throwaway image in a registry on its own runner with the KMS
# key, verifies the envelope as the platform's intake does, and prints the
# key's public half. It never calls the platform. Dispatch it on main with
# smoke_test=true and any placeholder for the other inputs, which it reads
# none of (README).

name: build

on:
  workflow_dispatch:
    inputs:
      build_id: {description: "The platform's build ID", required: true}
      repository: {description: "owner/name, linked through the App", required: true}
      tag: {description: "vX.Y.Z, signed", required: true}
      listing: {description: "organisation/plugin", required: true}
      registry: {description: "community or verified", required: true}
      image: {description: "Where the copy is pushed, without tag or digest", required: true}
      intake_url: {description: "Where results go; {build_id} is filled in", required: true}
      intake_nonce: {description: "The build's one-time nonce", required: true}
      base_images: {description: "The images a plugin may be built on, comma-separated", required: true}
      community_licence: {description: "Community's licence for a plugin's own code", required: true}
      smoke_test: {description: "Only attest and verify a throwaway image with the KMS key", type: boolean, default: false}

# Nothing by default; each job says what it holds.
permissions: {}

concurrency:
  group: build-${{ inputs.build_id }}
  cancel-in-progress: false

env:
  SIZE_CAP_BYTES: "1073741824"
  PLATFORM: ${{ vars.PLATFORM_URL }}               # https://open-meridian.com
  TRIVY_IMAGE: aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a
  CLAMAV_IMAGE: clamav/clamav:1.4@sha256:b5b910ce43d595bf8a2fe401e34db56434602b2c755b7c2b07f00c917d04d469
  KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  METADATA_TYPE: https://open-meridian.dev/attestation/plugin-metadata/v1
  # The image's metadata, at most: the declaration and the documentation,
  # which the SDK caps at 256 KiB.
  METADATA_CAP_BYTES: "1048576"
  # The meridian whose rules a plugin is held to, and its x86_64 Linux
  # binary's SHA-256 (meridian-cli's release v0.1.46).
  MERIDIAN_VERSION: 0.1.46
  MERIDIAN_SHA256: f648dab0b2f671a7b1c1a0d306d87c5a12b6fb18b3c427f78406edddda891816

jobs:
  build:
    if: ${{ !inputs.smoke_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The publisher's code runs in this job: no id-token, no packages, no
    # secrets. It can read, build and report, and nothing else.
    permissions:
      contents: read
    env:
      LISTING: ${{ inputs.listing }}
      REPOSITORY: ${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
      REGISTRY: ${{ inputs.registry }}
      BASE_IMAGES: ${{ inputs.base_images }}
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      verified: ${{ steps.tag.outputs.verified }}
      fingerprint: ${{ steps.tag.outputs.fingerprint }}
      private: ${{ steps.repo.outputs.private }}
      licence: ${{ steps.repo.outputs.licence }}
      base: ${{ steps.base.outputs.base }}
      size: ${{ steps.build.outputs.size }}
    steps:
      - name: Check out the commit the tag pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      - name: Verify the tag's signature against the organisation's keys
        id: tag
        run: |
          org="${LISTING%%/*}"
          # meridian.v1.SigningKeyStatus: issued_at_ns, keys, signature.
          curl -fsS "${PLATFORM}/api/v1/registry/signing-keys" -o status.json
          # Active keys only: not_trusted_after_ns 0, or later than now.
          jq -r --arg org "$org" --argjson now "$(date -u +%s)000000000" '
            .keys[] | select(.organisation == $org)
            | select(.not_trusted_after_ns == 0 or .not_trusted_after_ns > $now)
            | "builder@open-meridian \(.public_key)"' status.json > allowed_signers
          cd src
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if out="$(git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=../allowed_signers \
                verify-tag "refs/tags/${TAG}" 2>&1)"; then verified=true; else verified=false; fi
          echo "$out"
          fp="$(printf '%s' "$out" | grep -o 'SHA256:[A-Za-z0-9+/]*' | head -1 || true)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"

      - name: The repository's visibility and licence
        id: repo
        run: |
          curl -fsS "https://api.github.com/repos/${REPOSITORY}" > repo.json
          echo "private=$(jq -r .private repo.json)" >> "$GITHUB_OUTPUT"
          echo "licence=$(jq -r '.license.spdx_id // ""' repo.json)" >> "$GITHUB_OUTPUT"

      - name: meridian, pinned by its checksum
        # The rules `plugin check` holds are compiled into the binary, so the
        # builder names the release it holds plugins to, and the binary is
        # held to a checksum written here, not one fetched beside it.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/meridian" \
            "https://github.com/open-meridian/meridian-cli/releases/download/v${MERIDIAN_VERSION}/meridian-x86_64-unknown-linux-musl"
          echo "${MERIDIAN_SHA256}  $HOME/.local/bin/meridian" | sha256sum -c -
          chmod +x "$HOME/.local/bin/meridian"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Plugin check (the publish pre-flight's rules)
        # As `meridian plugin publish` runs it: `--verified` for the
        # verified registry, whose "role pages" finding is that run's
        # role-pages rule.
        run: |
          flags=""; [ "${REGISTRY}" = "verified" ] && flags="--verified"
          (cd src && meridian plugin check ${flags} --json) > check-run.json || true
          jq -e 'type == "object"' check-run.json >/dev/null 2>&1 || echo '{}' > check-run.json
          jq '
            def where: "\(.file)\(if .line then ":\(.line)" else "" end)";
            ([.rules[]? | select(.rule == "role-pages")][0]) as $pages |
            {passed: (.passed == true),
             detail: (if .passed == true
                      then "every rule holds (meridian \(.meridian // "?") plugin check)"
                      elif has("failures") then "\(.failures | length) place(s) fail: "
                        + ([.failures[0:10][] | "\(.rule) at \(where)"] | join("; "))
                      else "meridian plugin check did not run" end),
             role_pages: {passed: ($pages.outcome == "passed"),
               detail: (if $pages == null then "the role-pages rule did not run"
                        elif $pages.outcome == "passed" then "present"
                        else ([.failures[]? | select(.rule == "role-pages") | "\(.found) (\(where))"][0:5]
                              | if length > 0 then join("; ") else "role-pages \($pages.outcome)" end) end)}}
          ' check-run.json > check.json

      - name: Build
        id: build
        run: |
          docker build --pull -t candidate:local src
          size="$(docker image inspect candidate:local --format '{{.Size}}')"
          echo "size=${size}" >> "$GITHUB_OUTPUT"
          docker save candidate:local -o image.tar
          docker create --name fs candidate:local >/dev/null && docker export fs -o rootfs.tar

      - name: Built on plugin-python, by the image's own layers
        # Not the Dockerfile's text, which ARGs, --platform and stages make
        # unreliable: an allowed base, at the open-meridian version the image
        # carries, whose layers the image's begin with. A layer's ID is the
        # hash of its content, so no image has them without being built on it.
        id: base
        run: |
          base=""
          sdk="$(timeout 120 docker run --rm --network none --read-only --tmpfs /tmp \
                   --cap-drop ALL --security-opt no-new-privileges --entrypoint python candidate:local \
                   -I -c 'import importlib.metadata as m; print(m.version("open-meridian"))' 2>/dev/null || true)"
          if printf '%s' "$sdk" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.]+)?$'; then
            mine="$(docker image inspect candidate:local --format '{{json .RootFS.Layers}}')"
            IFS=, read -ra allowed <<< "${BASE_IMAGES}"
            for b in "${allowed[@]}"; do
              [ -n "$b" ] || continue
              docker pull -q "${b}:${sdk}" >/dev/null 2>&1 || continue
              theirs="$(docker image inspect "${b}:${sdk}" --format '{{json .RootFS.Layers}}')"
              if jq -en --argjson m "$mine" --argjson t "$theirs" \
                   '($t | length) > 0 and $m[0:($t | length)] == $t' >/dev/null; then
                digest="$(docker image inspect "${b}:${sdk}" --format '{{index .RepoDigests 0}}')"
                base="${b}:${sdk}@${digest#*@}"
                break
              fi
            done
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "built on: ${base:-no allowed base}"

      - name: The image's metadata, read from the image itself
        # What the plugin-metadata attestation carries (DESIGN25, ruling
        # 269): the declaration and the documentation's texts as the SDK in
        # the image prints them (`meridian-declaration`, `--documentation`),
        # the contract version the image's SDK declares (meridian.
        # SCHEMA_VERSION, what it sends at registration), the version of the
        # plugin the image has installed; its roles and interface from
        # [tool.meridian] at the commit built, as `meridian plugin upload`
        # reads them. Each text's digest is computed here, from the text.
        run: |
          echo '{}' > image-metadata.json
          python3 -I - src/pyproject.toml > pyproject.json <<'PY' || exit 0
          import json, sys, tomllib
          p = tomllib.load(open(sys.argv[1], "rb"))
          project, tool = p.get("project", {}), p.get("tool", {}).get("meridian", {})
          print(json.dumps({"name": str(project.get("name", "")),
                            "roles": [str(r) for r in tool.get("roles", [])],
                            "interface": tool.get("interface", False) is True,
                            "declaration": str(tool.get("declaration", ""))}))
          PY
          name="$(jq -r .name pyproject.json)"; ref="$(jq -r .declaration pyproject.json)"
          run() { timeout 120 docker run --rm --network none --read-only --tmpfs /tmp \
                    --cap-drop ALL --security-opt no-new-privileges "$@"; }
          run --entrypoint meridian-declaration candidate:local "$ref" > declaration.json || echo '{}' > declaration.json
          run --entrypoint meridian-declaration candidate:local --documentation "$ref" > texts.json || echo '[]' > texts.json
          run --entrypoint python candidate:local -I -c '
          import importlib.metadata as m, json, sys, meridian
          try:
              version = m.version(sys.argv[1])
          except m.PackageNotFoundError:
              version = ""
          print(json.dumps({"schema_version": str(meridian.SCHEMA_VERSION), "version": version,
                            "sdk_version": m.version("open-meridian")}))' "$name" > image.json || echo '{}' > image.json
          python3 -I - . > image-metadata.json <<'PY' || echo '{}' > image-metadata.json
          import hashlib, json, pathlib, sys
          w = pathlib.Path(sys.argv[1])
          def read(name, empty):
              try:
                  value = json.loads((w / name).read_text())
              except (OSError, ValueError):
                  return empty
              return value if isinstance(value, type(empty)) else empty
          py, decl = read("pyproject.json", {}), read("declaration.json", {})
          texts, img = read("texts.json", []), read("image.json", {})
          def title(markdown):
              return next((line[2:].strip() for line in markdown.splitlines() if line.startswith("# ")), "")
          sections = [t for t in texts if isinstance(t, dict)
                      and isinstance(t.get("section"), str) and isinstance(t.get("markdown"), str)]
          print(json.dumps({
              "metadata": {"name": py.get("name", ""), "version": str(img.get("version", "")),
                           "roles": py.get("roles", []), "interface": py.get("interface", False),
                           "sdk_version": str(img.get("sdk_version", "")), "declaration": decl},
              "schema_version": str(img.get("schema_version", "")),
              "documentation": [{"name": t["section"], "title": title(t["markdown"]), "text": t["markdown"],
                                 "digest": "sha256:" + hashlib.sha256(t["markdown"].encode("utf-8")).hexdigest()}
                                for t in sections],
          }, sort_keys=True))
          PY
          [ "$(stat -c %s image-metadata.json)" -le "${METADATA_CAP_BYTES}" ] || echo '{}' > image-metadata.json
          jq -c '{name: .metadata.name, version: .metadata.version, roles: .metadata.roles,
                  contract: .schema_version, sections: [.documentation[]?.name]}' image-metadata.json

      - name: Bill of materials, vulnerabilities and secrets (Trivy)
        run: |
          docker run --rm -v "$PWD:/w" "${TRIVY_IMAGE}" image --input /w/image.tar \
            --format spdx-json --output /w/sbom.spdx.json
          docker run --rm -v "$PWD:/w" "${TRIVY_IMAGE}" image --input /w/image.tar \
            --scanners vuln,secret --format json --output /w/trivy.json

      - name: Malware (ClamAV)
        run: |
          mkdir rootfs && tar -xf rootfs.tar -C rootfs
          docker run --rm -v "$PWD/rootfs:/scan:ro" "${CLAMAV_IMAGE}" \
            sh -c 'freshclam --quiet; clamscan -r --infected --no-summary /scan' > clamav.txt || true

      - name: The role's conformance suite, in the image (the SDK's runner)
        # Ruling 268: each role's suite through the SDK's runner and the
        # plugin's own tests, run by `meridian plugin check --verified
        # --run-tests` against the code the image holds -- a layer over it
        # adds the plugin's [dev] extras, and the run has no network and a
        # read-only root. It passes when role-suite and tests-pass both do.
        run: |
          echo '{"passed": false, "detail": "the conformance suite did not run"}' > conformance.json
          mkdir -p testlayer
          python3 -I -c 'import sys, tomllib; p = tomllib.load(open(sys.argv[1], "rb"));
          print("\n".join(str(r) for r in p.get("project", {}).get("optional-dependencies", {}).get("dev", [])))' \
            src/pyproject.toml > testlayer/dev.txt || true
          grep -qiE '^pytest([^-_a-z0-9]|$)' testlayer/dev.txt || echo pytest >> testlayer/dev.txt
          user="$(docker image inspect candidate:local --format '{{.Config.User}}')"
          printf '%s\n' 'FROM candidate:local' 'USER root' \
            'RUN --mount=type=bind,source=dev.txt,target=/tmp/dev.txt pip install --no-cache-dir -r /tmp/dev.txt' \
            'ARG RUN_AS=65532' 'USER ${RUN_AS}' > testlayer/Dockerfile
          DOCKER_BUILDKIT=1 docker build -q --build-arg "RUN_AS=${user:-65532}" -t candidate:test testlayer >/dev/null || exit 0
          timeout 1200 docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/src:/w:ro" -v "$HOME/.local/bin/meridian:/usr/local/bin/meridian:ro" -w /w \
            --entrypoint meridian candidate:test plugin check --verified --run-tests --json \
            > conformance-run.json || true
          jq -e 'type == "object"' conformance-run.json >/dev/null 2>&1 || exit 0
          jq '
            ([.rules[]? | select(.rule == "role-suite")][0].outcome // "not run") as $suite |
            ([.rules[]? | select(.rule == "tests-pass")][0].outcome // "not run") as $tests |
            [.failures[]? | select(.rule == "role-suite" or .rule == "tests-pass") | "\(.rule): \(.found)"] as $why |
            {passed: ($suite == "passed" and $tests == "passed"),
             detail: (if $suite == "passed" and $tests == "passed"
                      then "the role suites and the plugin'"'"'s tests passed in the image (meridian \(.meridian // "?") plugin check --verified --run-tests)"
                      else "role-suite \($suite), tests-pass \($tests)"
                        + (if ($why | length) > 0 then ": " + ($why[0:5] | join("; ")) else "" end) end)}
          ' conformance-run.json > conformance.json

      - name: Hand the image and findings to the signing job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-${{ inputs.build_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            image.tar
            sbom.spdx.json
            trivy.json
            clamav.txt
            check.json
            conformance.json
            image-metadata.json

  sign:
    needs: build
    if: ${{ always() && !inputs.smoke_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that reaches the KMS key or the platform. It runs none of
    # the publisher's code: it loads an image tarball and pushes it.
    environment: signing
    permissions:
      contents: read
      packages: write   # community copies, ghcr.io/open-meridian/plugins/...
      id-token: write   # the platform's intake token, and KMS via WIF
    env:
      AUDIENCE: ${{ vars.PLATFORM_OIDC_AUDIENCE }}  # open-meridian-registry
      KMS_KEY: ${{ vars.KMS_KEY }}                  # gcpkms://projects/.../cryptoKeyVersions/1
      BUILD_ID: ${{ inputs.build_id }}
      REPOSITORY: ${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
      REGISTRY: ${{ inputs.registry }}
      IMAGE: ${{ inputs.image }}
      INTAKE_URL: ${{ inputs.intake_url }}
      BASE_IMAGES: ${{ inputs.base_images }}
      COMMUNITY_LICENCE: ${{ inputs.community_licence }}
      BUILT_COMMIT: ${{ needs.build.outputs.commit }}
      BUILT_VERIFIED: ${{ needs.build.outputs.verified }}
      BUILT_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      BUILT_PRIVATE: ${{ needs.build.outputs.private }}
      BUILT_LICENCE: ${{ needs.build.outputs.licence }}
      BUILT_BASE: ${{ needs.build.outputs.base }}
      BUILT_SIZE: ${{ needs.build.outputs.size }}
    steps:
      # First, before any header could print it: the nonce masked, read from
      # the event payload rather than written into this script or an env.
      - name: Mask the build's nonce
        run: echo "::add-mask::$(jq -r '.inputs.intake_nonce // ""' "$GITHUB_EVENT_PATH")"

      - name: Tell the platform the build has begun (RecordBuildStarted)
        env:
          INTAKE_NONCE: ${{ inputs.intake_nonce }}
        run: |
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)"
          echo "::add-mask::${token}"
          url="${INTAKE_URL/\{build_id\}/${BUILD_ID}}"
          jq -n --arg build_id "${BUILD_ID}" --arg intake_nonce "${INTAKE_NONCE}" \
            --arg log_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{build_id: $build_id, intake_nonce: $intake_nonce, log_url: $log_url}' \
          | curl -fsS -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' --data @- "${url%/results}/started"

      - name: The build's image and findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-${{ inputs.build_id }}
        continue-on-error: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
        with:
          # The release `attest --new-bundle-format --key --tlog-upload=false`
          # was proven with; pinned, so an installer default cannot move it.
          cosign-release: v2.5.2

      - name: Authenticate to the KMS key (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SIGNER_SERVICE_ACCOUNT }}

      - name: Push by digest, within the size cap
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          size="${BUILT_SIZE}"; case "$size" in ''|*[!0-9]*) size=0 ;; esac
          if [ ! -s image.tar ] || [ "$size" -gt "${SIZE_CAP_BYTES}" ]; then
            echo "no image, or over the 1 GiB cap: nothing is pushed"
            echo "digest=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker load -i image.tar
          if [ "${REGISTRY}" = "community" ]; then
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          else
            gcloud auth configure-docker "${IMAGE}" --quiet  # verified, Phase 2
          fi
          ref="${IMAGE}:${TAG}"
          docker tag candidate:local "$ref" && docker push "$ref"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Provenance and metadata, signed with the platform's KMS key
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="${IMAGE}@${DIGEST}"
          jq -n --arg repo "${REPOSITORY}" --arg commit "${BUILT_COMMIT}" \
            --arg tag "${TAG}" --arg signer "${BUILT_FINGERPRINT}" \
            --arg builder "${GITHUB_REPOSITORY}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{
              buildDefinition: {buildType: "https://open-meridian.dev/plugin-builder/v1",
                externalParameters: {repository: $repo, tag: $tag},
                resolvedDependencies: [{uri: ("git+https://github.com/" + $repo), digest: {gitCommit: $commit}}]},
              runDetails: {builder: {id: ("https://github.com/" + $builder)},
                metadata: {invocationId: $run}},
              repository: $repo, commit: $commit, tag: $tag, signer: $signer, builder: $builder}' \
            > provenance.json
          # The image's metadata as the build job read it from the image,
          # within its cap, and only the predicate's own fields.
          if [ ! -s image-metadata.json ] \
             || [ "$(stat -c %s image-metadata.json)" -gt "${METADATA_CAP_BYTES}" ] \
             || ! jq -e 'type == "object"' image-metadata.json >/dev/null 2>&1; then
            echo '{}' > image-metadata.json
          fi
          jq '{metadata: (.metadata // {} | if type == "object" then . else {} end
                 | {name, version, roles, interface, sdk_version, declaration}),
               schema_version: (.schema_version // "" | tostring),
               documentation: [(.documentation // [])[] | select(type == "object") | {name, title, text, digest}]}' \
            image-metadata.json > metadata.json
          # cosign's vuln predicate carries the scanner's report as
          # scanner.result (trivy's own cosign-vuln format); a raw Trivy
          # report given as --type vuln is dropped to an empty predicate.
          [ -s trivy.json ] || echo '{}' > trivy.json
          [ -s sbom.spdx.json ] || echo '{}' > sbom.spdx.json
          jq --arg image "${TRIVY_IMAGE}" '
            ($image | split("@")[0] | split(":")[1]) as $version |
            {invocation: {parameters: null, uri: "", event_id: "", "builder.id": ""},
             scanner: {uri: ("pkg:github/aquasecurity/trivy@" + $version), version: $version,
               db: {uri: "", version: ""}, result: .},
             metadata: {scanStartedOn: (.CreatedAt // (now | todate)),
               scanFinishedOn: (.CreatedAt // (now | todate))}}' trivy.json > vuln.json
          # Sigstore bundles, each an OCI 1.1 referrer of the image, which the
          # platform reads by digest. The provenance's type is its URI, so
          # cosign keeps the predicate as written: `slsaprovenance1` parses it
          # into SLSA's fields and drops repository, commit, tag and signer.
          cosign attest --yes --tlog-upload=false --new-bundle-format \
            --key "${KMS_KEY}" --type "https://slsa.dev/provenance/v1" --predicate provenance.json "$image"
          cosign attest --yes --tlog-upload=false --new-bundle-format \
            --key "${KMS_KEY}" --type "${METADATA_TYPE}" --predicate metadata.json "$image"
          cosign attest --yes --tlog-upload=false --new-bundle-format \
            --key "${KMS_KEY}" --type spdxjson --predicate sbom.spdx.json "$image"
          cosign attest --yes --tlog-upload=false --new-bundle-format \
            --key "${KMS_KEY}" --type vuln --predicate vuln.json "$image"

      # From here the steps run even when one above failed (the attestations,
      # say): the platform then refuses the build, naming what it could not
      # read, rather than holding the version as building.
      - name: Findings, one per check, under plan Q4's policy
        if: ${{ !cancelled() }}
        run: |
          [ -s sbom.spdx.json ] || echo '{}' > sbom.spdx.json
          [ -s trivy.json ] || echo '{}' > trivy.json
          [ -s check.json ] || echo '{}' > check.json
          [ -s conformance.json ] || echo '{"passed": false}' > conformance.json
          touch clamav.txt
          # The build job's words, held to their forms before jq reads them.
          [ "${BUILT_VERIFIED}" = "true" ] && verified=true || verified=false
          [ "${BUILT_PRIVATE}" = "false" ] && private=false || private=true
          size="${BUILT_SIZE}"; case "$size" in ''|*[!0-9]*) size=0 ;; esac
          # CISA's KEV catalogue; unread, every vulnerability found blocks.
          curl -fsS "${KEV_URL}" | jq '[.vulnerabilities[].cveID]' > kev.json || echo 'null' > kev.json
          jq -n \
            --arg registry "${REGISTRY}" \
            --argjson verified "${verified}" \
            --arg signer "${BUILT_FINGERPRINT}" \
            --argjson private "${private}" \
            --arg licence "${BUILT_LICENCE}" \
            --arg wanted "${COMMUNITY_LICENCE}" \
            --arg base "${BUILT_BASE}" \
            --arg bases "${BASE_IMAGES}" \
            --argjson size "${size}" \
            --argjson cap "${SIZE_CAP_BYTES}" \
            --slurpfile sbom sbom.spdx.json --slurpfile trivy trivy.json \
            --slurpfile check check.json --slurpfile conformance conformance.json \
            --slurpfile kev kev.json --rawfile clamav clamav.txt '
            def f($check; $sev; $detail): {check: $check,
              severity: ("BUILD_FINDING_SEVERITY_" + $sev), detail: ($detail | tostring | .[0:2000])};
            ($registry == "community") as $community |
            [($trivy[0].Results // [])[] | (.Vulnerabilities // [])[]] as $vulns |
            [($trivy[0].Results // [])[] | (.Secrets // [])[]] as $secrets |
            [$clamav | split("\n")[] | select(test(" FOUND$"))] as $malware |
            [($sbom[0].packages // [])[]
              | select((.licenseConcluded // .licenseDeclared // "")
                | test("^(GPL-2.0|GPL-3.0|AGPL-|SSPL-|OSL-|EUPL-|CPAL-|RPL-)"))
              | "\(.name) \(.versionInfo // "") (\(.licenseConcluded // .licenseDeclared))"] as $copyleft |
            ($kev[0]) as $kevs |
            [$vulns[] | select(($kevs == null) or (.VulnerabilityID as $id | $kevs | index($id))
              or (.Severity == "CRITICAL" and (.FixedVersion // "") != ""))
              | "\(.VulnerabilityID) (\(.Severity | ascii_downcase), \(.FixedVersion // "no fix"))"] as $blocking |
            [
              (if $verified then f("tag signature"; "PASSED"; "signed by " + $signer)
               else f("tag signature"; "BLOCKED"; "the tag is not signed by a key the organisation holds now") end),
              ([ (if $community and $private then "a community plugin'"'"'s repository is public" else empty end),
                 (if $community and $licence != $wanted
                  then "a community plugin'"'"'s own code is under " + $wanted + ", not " + (if $licence == "" then "no licence found" else $licence end)
                  else empty end) ] as $p
               | if ($p | length) > 0 then f("repository and licence"; "BLOCKED"; $p | join("; "))
                 else f("repository and licence"; "PASSED"; if $licence == "" then "no licence named" else $licence end) end),
              (if ([$bases | split(",")[] | select(. != "") as $b
                    | select($base == $b or ($base | startswith($b + "@")) or ($base | startswith($b + ":")))] | length) > 0
               then f("base image"; "PASSED"; $base)
               else f("base image"; "BLOCKED"; "built on " + (if $base == "" then "nothing named" else $base end) + ", not plugin-python") end),
              (if ($copyleft | length) > 0 then f("dependency screen"; "WARNING"; "strong copyleft, for counsel: " + ($copyleft[0:20] | join("; ")))
               else f("dependency screen"; "PASSED"; "no strong copyleft found") end),
              (if ($vulns | length) == 0 then f("vulnerabilities"; "PASSED"; "none found")
               elif ($blocking | length) > 0 then f("vulnerabilities"; "BLOCKED";
                 (if $kevs == null then "CISA'"'"'s KEV list could not be read; " else "" end) + ($blocking[0:20] | join("; ")))
               else f("vulnerabilities"; "WARNING"; [$vulns[0:20][] | "\(.VulnerabilityID) (\(.Severity | ascii_downcase))"] | join("; ")) end),
              (if ($secrets | length) > 0 then f("secrets"; "BLOCKED"; [$secrets[0:10][] | "\(.RuleID) in \(.Target // "")"] | join("; "))
               else f("secrets"; "PASSED"; "none found") end),
              (if ($malware | length) > 0 then f("malware"; "BLOCKED"; $malware[0:10] | join("; "))
               else f("malware"; "PASSED"; "none found") end),
              (if $conformance[0].passed == true then f("conformance"; "PASSED"; $conformance[0].detail // "the role'"'"'s suite passed")
               else f("conformance"; "BLOCKED"; $conformance[0].detail // "the role'"'"'s suite did not pass") end),
              (if $size <= 0 then f("size"; "BLOCKED"; "the image'"'"'s size was not measured")
               elif $size > $cap then f("size"; "BLOCKED"; "\($size) bytes, over the cap of 1 GiB")
               else f("size"; "PASSED"; "\($size) bytes") end),
              (if $check[0].passed == true then f("plugin check"; "PASSED"; $check[0].detail // "passed")
               else f("plugin check"; "BLOCKED"; $check[0].detail // "meridian plugin check did not pass") end),
              (if $community then empty
               elif $check[0].role_pages.passed == true then f("role pages"; "PASSED"; $check[0].role_pages.detail // "present")
               else f("role pages"; "BLOCKED"; $check[0].role_pages.detail // "the role pages are missing") end)
            ]' > findings.json

      - name: Who the platform will see
        if: ${{ !cancelled() }}
        id: oidc
        run: |
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Hand the results back (RecordBuildResults)
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          INTAKE_NONCE: ${{ inputs.intake_nonce }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          url="${INTAKE_URL/\{build_id\}/${BUILD_ID}}"
          jq -n --arg build_id "${BUILD_ID}" --arg intake_nonce "${INTAKE_NONCE}" \
            --arg image_digest "${DIGEST}" --slurpfile findings findings.json \
            '{build_id: $build_id, intake_nonce: $intake_nonce, image_digest: $image_digest,
              findings: $findings[0]}' \
          | curl -fsS -X POST -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' --data @- "$url"

  # Ruling 271: the signing path proven without a publish. In `signing`, so
  # its token's subject and workflow ref are the build's and the key's
  # condition holds unchanged; it pushes nothing beyond its own runner and
  # never calls the platform (whose intake would refuse it: no build, no
  # nonce).
  smoke:
    if: ${{ inputs.smoke_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: signing
    permissions:
      contents: read
      id-token: write   # KMS via WIF, and nothing else
    env:
      KMS_KEY: ${{ vars.KMS_KEY }}
    services:
      registry:
        # Distribution serves no referrers API, as ghcr.io does not: cosign
        # keeps the referrers tag schema, which the intake reads.
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
        with:
          cosign-release: v2.5.2

      - name: Authenticate to the KMS key (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SIGNER_SERVICE_ACCOUNT }}

      - name: A throwaway image, in a registry on this runner
        # Written through the registry's own API: an OCI manifest naming
        # this run, no layers and nothing built, so the signing environment
        # runs no build at all.
        id: image
        run: |
          python3 -I - "localhost:5000" smoke >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, os, sys, urllib.parse, urllib.request
          host, name = sys.argv[1:]
          def blob(data, media):
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              start = urllib.request.Request(f"http://{host}/v2/{name}/blobs/uploads/", method="POST")
              with urllib.request.urlopen(start, timeout=15) as answer:
                  location = urllib.parse.urljoin(f"http://{host}/", answer.headers["Location"])
              sep = "&" if "?" in location else "?"
              put = urllib.request.Request(f"{location}{sep}digest={digest}", data=data, method="PUT",
                                           headers={"Content-Type": "application/octet-stream"})
              urllib.request.urlopen(put, timeout=15).close()
              return {"mediaType": media, "digest": digest, "size": len(data)}
          config = json.dumps({"architecture": "amd64", "os": "linux", "rootfs": {"type": "layers", "diff_ids": []},
                               "config": {"Labels": {"smoke-test": os.environ.get("GITHUB_RUN_ID", "")}}}).encode()
          manifest = json.dumps({"schemaVersion": 2, "mediaType": "application/vnd.oci.image.manifest.v1+json",
                                 "config": blob(config, "application/vnd.oci.image.config.v1+json"),
                                 "layers": []}).encode()
          put = urllib.request.Request(f"http://{host}/v2/{name}/manifests/run", data=manifest, method="PUT",
                                       headers={"Content-Type": "application/vnd.oci.image.manifest.v1+json"})
          urllib.request.urlopen(put, timeout=15).close()
          print("digest=sha256:" + hashlib.sha256(manifest).hexdigest())
          PY

      - name: Attested with the platform's KMS key, as a build's metadata is
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{smoke_test: true, run: $run}' > smoke.json
          cosign attest --yes --tlog-upload=false --new-bundle-format --allow-insecure-registry \
            --key "${KMS_KEY}" --type "${METADATA_TYPE}" --predicate smoke.json "localhost:5000/smoke@${DIGEST}"

      - name: Verified as the platform's intake verifies; the public key printed
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign public-key --key "${KMS_KEY}" > platform.pub
          echo "The platform's public key, the half a CLI release pins:"
          cat platform.pub
          # The intake's reading (build_artifacts, registry_signing): the
          # referrers API or its tag schema, each layer's DSSE envelope bare
          # or in a Sigstore bundle, the envelope alone trusted, its PAE
          # verified with ECDSA P-256 over SHA-256.
          mkdir envelopes
          python3 -I - "localhost:5000" smoke "${DIGEST}" "${METADATA_TYPE}" envelopes <<'PY'
          import base64, json, pathlib, re, sys, urllib.error, urllib.request
          host, name, digest, wanted, out = sys.argv[1:]
          INDEX = "application/vnd.oci.image.index.v1+json"
          BUNDLE = re.compile(r"application/vnd\.dev\.sigstore\.bundle(\.v[0-9.]+)?\+json(;.*)?")
          def get(path, accept):
              request = urllib.request.Request(f"http://{host}/v2/{name}/{path}", headers={"Accept": accept})
              with urllib.request.urlopen(request, timeout=15) as answer:
                  return json.loads(answer.read())
          try:
              index = get(f"referrers/{digest}", INDEX)
          except urllib.error.HTTPError as unserved:
              if unserved.code not in (404, 405):
                  raise
              index = get("manifests/" + digest.replace(":", "-", 1), INDEX)
          found = 0
          for manifest in index.get("manifests") or []:
              body = get(f"manifests/{manifest['digest']}", "application/vnd.oci.image.manifest.v1+json")
              for layer in body.get("layers") or []:
                  try:
                      blob = get(f"blobs/{layer['digest']}", "*/*")
                  except ValueError:
                      continue
                  envelope = blob if "payloadType" in blob else None
                  inner = blob.get("dsseEnvelope")
                  if envelope is None and isinstance(inner, dict) and any(
                          BUNDLE.fullmatch(str(m or "")) for m in (layer.get("mediaType"), blob.get("mediaType"))):
                      envelope = inner
                  if envelope is None:
                      continue
                  body_bytes = base64.b64decode(envelope["payload"])
                  statement = json.loads(body_bytes)
                  algorithm, _, value = digest.partition(":")
                  if statement.get("predicateType") != wanted or not any(
                          (s.get("digest") or {}).get(algorithm) == value for s in statement.get("subject") or []):
                      continue
                  t = str(envelope["payloadType"]).encode("utf-8")
                  pae = b"DSSEv1 %d %s %d %s" % (len(t), t, len(body_bytes), body_bytes)
                  for n, signature in enumerate(envelope.get("signatures") or []):
                      stem = pathlib.Path(out) / f"{found}-{n}"
                      stem.with_suffix(".pae").write_bytes(pae)
                      stem.with_suffix(".sig").write_bytes(base64.b64decode(signature["sig"]))
                  found += 1
          print(f"{found} envelope(s) of {wanted} on {digest}")
          PY
          verified=0
          for sig in envelopes/*.sig; do
            [ -e "$sig" ] || continue
            if openssl dgst -sha256 -verify platform.pub -signature "$sig" "${sig%.sig}.pae" >/dev/null; then
              verified=$((verified + 1))
            fi
          done
          [ "$verified" -gt 0 ] || { echo "smoke test FAILED: no envelope verifies with the KMS key's public half"; exit 1; }
          echo "smoke test OK: ${verified} signature(s) verify with the platform's key, read as the intake reads them"
